<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="t d">
<title id="t">Marcelo Aguilar</title>
<desc id="d">Software Engineering student at Inteli, São Paulo. Open to internships.</desc>
<defs>
<style>
@font-face { font-family: 'MA Anton'; src: url(data:font/woff2;base64,) format('woff2'); }
@font-face { font-family: 'MA Bodoni'; font-style: italic; src: url(data:font/woff2;base64,) format('woff2'); }
@font-face { font-family: 'MA Sans'; src: url(data:font/woff2;base64,) format('woff2'); }
.last { font-family: 'MA Anton', 'Anton', Impact, 'Arial Narrow', sans-serif; font-size: 340.45px; letter-spacing: 4.09px; }
.first { font-family: 'MA Bodoni', 'Bodoni Moda', Didot, 'Bodoni MT', serif; font-style: italic; font-size: 132px; fill: #ede3d6; }
.info { font-family: 'MA Sans', 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 24px; font-weight: 500; }
.lamp { transform: translate(780px, 252.3px); animation: sweep 2.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both; }
@keyframes sweep {
  from { transform: translate(-260px, 252.3px); }
  to { transform: translate(780px, 252.3px); }
}
@media (prefers-reduced-motion: reduce) { .lamp { animation: none; } }
</style>
<clipPath id="frame"><rect width="1200" height="540" rx="18"/></clipPath>
<clipPath id="letters"><text class="last" x="72" y="422">AGUILAR</text></clipPath>
<linearGradient id="depth" x1="0" y1="129.4" x2="0" y2="422" gradientUnits="userSpaceOnUse">
  <stop offset="0" stop-color="#c1121f"/>
  <stop offset="1" stop-color="#7a0b14"/>
</linearGradient>
<radialGradient id="beam">
  <stop offset="0" stop-color="#f0353e" stop-opacity="0.95"/>
  <stop offset="0.45" stop-color="#f0353e" stop-opacity="0.45"/>
  <stop offset="1" stop-color="#f0353e" stop-opacity="0"/>
</radialGradient>
<radialGradient id="halo">
  <stop offset="0" stop-color="#ede3d6" stop-opacity="0.10"/>
  <stop offset="0.5" stop-color="#3b070d" stop-opacity="0.35"/>
  <stop offset="1" stop-color="#3b070d" stop-opacity="0"/>
</radialGradient>
<filter id="grain" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
  <feColorMatrix values="0 0 0 0 0.93  0 0 0 0 0.89  0 0 0 0 0.84  0 0 0 0.07 0"/>
</filter>
</defs>
<g clip-path="url(#frame)">
  <rect width="1200" height="540" fill="#060405"/>
  <g class="lamp"><circle r="520" fill="url(#halo)"/></g>
  <text class="last" x="72" y="422" fill="url(#depth)">AGUILAR</text>
  <g clip-path="url(#letters)">
    <g class="lamp"><circle r="300" fill="url(#beam)"/></g>
  </g>
  <text class="first" x="78" y="163.4">Marcelo</text>
  <line x1="72" y1="460" x2="1128" y2="460" stroke="#ede3d6" stroke-opacity="0.16"/>
  <text class="info" x="72" y="506" fill="#ede3d6">Software Engineering student at Inteli, São Paulo</text>
  <circle cx="889.4" cy="498" r="6" fill="#f0353e"/>
  <text class="info" x="907.4" y="506" fill="#c9a88a">Open to internships</text>
  <rect width="1200" height="540" filter="url(#grain)"/>
</g>
</svg>
